[project]
name = "wikiteam3"
version = "3.0.0"
description = "Tools for downloading and preserving wikis. We archive wikis, from Wikipedia to tiniest wikis. As of 2020, WikiTeam has preserved more than 250,000 wikis."
license = "GPL-3.0-or-later"
authors = [
    { name = "MediaWiki Dump Generator Contributors", email = "git@randomcat.org" }
]
maintainers = [
    { name = "Janet Cobb", email = "git@randomcat.org" },
    { name = "Elsie Hupp", email = "github@elsiehupp.com" }
]
readme = "README.md"
keywords = [
    "archiveteam",
    "mediawiki",
    "preservation",
    "wiki",
    "wikipedia"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Wiki",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Sociology :: History",
    "Topic :: System :: Archiving",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities"
]
# packages = [
#     { include = "wikiteam3/**/*"},
# ]
# exclude = ["wikiteam3/dumpgenerator/test/*"]

dependencies = [
    "requests >= 2.32.3",
    "internetarchive >= 5.5.1",
    "lxml >= 6.1.0",
    "mwclient >= 0.10.1",
    "PyMySQL >= 1.1.1",
    "pywikibot >= 11.0.0",
    "urllib3 >= 2.6.3",
    "wikitools3 >= 3.0.0",
    "pymysql",
    "file_read_backwards >= 2.0.0",
    "pre-commit-poetry-export >= 0.1.2",
    "setuptools >= 82.0.0"
]
requires-python = ">=3.13,<4"

[project.urls]
# Homepage = "https://wiki.archiveteam.org/index.php/WikiTeam"
Repository = "https://github.com/mediawiki-client-tools/mediawiki-dump-generator"
# Documentation = "https://wikiteam.readthedocs.io"

[tool.mypy]
follow_untyped_imports = true

[project.scripts]
dumpgenerator = "wikiteam3.dumpgenerator:main"
# gui = "wikiteam3.gui:main"
launcher = "wikiteam3.launcher:main"
# not-archived = "wikiteam3.not-archived:main"
uploader = "wikiteam3.uploader:main"
# wikiadownloader = "wikiteam3.wikiadownloader:main"
# wikipediadownloader = "wikiteam3.wikipediadownloader:main"
# wikispaces = "wikiteam3.wikispaces:main"

[tool.isort]
profile = "black"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
requests = "^2.32.0"
flake8 = "^3.9.2"
pre-commit = "^2.17.0"
pymarkdown = "^0.1.4"
setuptools = "^82.0.0"
black = "^26.3.1"
isort = "^8.0.1"
mypy = "^1.20.2"
types-requests = "^2.33.0.20260408"
lxml-stubs = "^0.5.1"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pymarkdown]
disable-rules = "line-length,no-inline-html"
